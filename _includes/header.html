<header class="site-header" role="banner">
  <div class="wrapper header-inner">

    <div class="header-left">
      <a class="site-title" href="{{ '/' | relative_url }}">
        {{ site.title | escape }}
      </a>
    </div>

    <div class="header-right">
      <!-- Menu button + dropdown grouped together -->
      <div class="menu-wrapper">
        <button
          id="nav-toggle"
          class="nav-toggle"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span class="nav-toggle-icon">☰</span>
          <span class="nav-toggle-label">Menu</span>
        </button>

        <!-- Floating menu window (anchored to the Menu button) -->
        <nav class="site-nav-mobile" id="site-nav-mobile">
          <a class="page-link" href="{{ '/' | relative_url }}">Home</a>
          <a class="page-link" href="{{ '/about/' | relative_url }}">About</a>
          <a class="page-link" href="{{ '/projects/' | relative_url }}">Projects</a>
        </nav>
      </div>

      <!-- Download CV button -->
      <button
        id="cv-button"
        class="cv-button"
        type="button"
        data-cv-url="{{ '/assets/cv/JamieKoflerCV.pdf' | relative_url }}"
      >
        Download CV
      </button>

      <!-- Theme toggle (always far right) -->
      <button id="theme-toggle" class="theme-toggle" type="button">
        <span class="theme-toggle-icon">🌙</span>
        <span class="theme-toggle-label">Dark</span>
      </button>
    </div>
  </div>
</header>

<!-- CV DOWNLOAD CONFIRMATION MODAL -->
<div class="cv-modal-backdrop" id="cv-modal-backdrop" aria-hidden="true">
  <div class="cv-modal" role="dialog" aria-modal="true" aria-labelledby="cv-modal-title">
    <h2 id="cv-modal-title">Download CV</h2>
    <p>Do you want to download <strong>JamieKoflerCV.pdf</strong>?</p>
    <div class="cv-modal-actions">
      <button type="button" class="cv-modal-btn cv-modal-confirm" id="cv-confirm">Yes</button>
      <button type="button" class="cv-modal-btn cv-modal-cancel" id="cv-cancel">No</button>
    </div>
  </div>
</div>
